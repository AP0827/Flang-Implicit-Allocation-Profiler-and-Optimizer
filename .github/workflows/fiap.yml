name: FIAP verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-smoke:
    name: Python/script smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python helpers
        run: python -m compileall scripts src

  full-flang-pipeline:
    name: Full Flang pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build FIAP
        run: ./build.sh
      - name: Run real Fortran pipeline
        run: ./run.sh --benchmark-runs 5
      - name: Check generated evidence
        run: python3 scripts/check_pipeline_outputs.py --reports-dir reports --require-benchmark
      - name: Run CTest
        run: ctest --test-dir build --output-on-failure
